<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CivicFix Admin Analytics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!--<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
display:flex;
}

/* SIDEBAR */

.sidebar{
width:240px;
height:100vh;
background:#020617;
padding:30px 20px;
position:fixed;
display:flex;
flex-direction:column;
}

.sidebar h2{
color:#38bdf8;
margin-bottom:40px;
}

.sidebar a{
text-decoration:none;
color:#cbd5f5;
padding:10px 0;
margin-bottom:10px;
}

.sidebar a:hover{
color:#38bdf8;
}

.highlight{
font-size: 1.3rem;
font-weight: 900;
color: #38bdf8;
}

/* MAIN */

.main{
margin-left:240px;
width:100%;
padding:35px;
}

/* HEADER */

.header h1{
font-size:32px;

background:linear-gradient(90deg,#38bdf8,#818cf8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

margin-bottom:25px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:35px;
}

.stat-card{
background:#1e293b;
padding:20px;
border-radius:12px;
text-align:center;
}

.stat-card h2{
color:#38bdf8;
font-size:28px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
gap:30px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
}

.card h3{
color:#38bdf8;
margin-bottom:20px;
}

</style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h2>CivicFix Admin</h2>

<a href="{{ url_for('admin.dashboard') }}">Dashboard</a> <a href="{{ url_for('admin.reports') }}">Reports</a> <a href="{{ url_for('admin.admin_analytics') }}" class="highlight" style="color: #38bdf8;">Analytics</a> <a href="/logout">Logout</a>

</div>

<!-- MAIN -->

<div class="main">

<div class="header">
<h1>Analytics Dashboard</h1>
</div>

<!-- STATS -->

<div class="stats">

<div class="stat-card">
<h2 id="totalReports">{{ stats['total'] }}</h2>
<p>Total Reports</p>
</div>

<div class="stat-card">
<h2 id="pendingReports">{{ stats['pending'] }}</h2>
<p>Pending</p>
</div>

<div class="stat-card">
<h2 id="progressReports">{{ stats['in_progress'] }}</h2>
<p>In Progress</p>
</div>

<div class="stat-card">
<h2 id="resolvedReports">{{ stats['resolved'] }}</h2>
<p>Resolved</p>
</div>

</div>

<!-- CHARTS -->

<div class="grid">

<div class="card">
<h3>Issues by Category</h3>
<canvas id="categoryChart"></canvas>
</div>

<div class="card">
<h3>Status Distribution</h3>
<canvas id="statusChart"></canvas>
</div>

<div class="card">
<h3>Reports per Month</h3>
<canvas id="monthlyChart"></canvas>
</div>

</div>

</div>

<script>

/* CREATE EMPTY CHARTS */

let categoryChart = new Chart(
document.getElementById("categoryChart"),
{
type:"bar",
data:{
labels:[],
datasets:[{
data:[],
backgroundColor:"#38bdf8"
}]
}
});

let statusChart = new Chart(
document.getElementById("statusChart"),
{
type:"doughnut",
data:{
labels:["Pending","In Progress","Resolved"],
datasets:[{
data:[],
backgroundColor:["#facc15","#38bdf8","#22c55e"]
}]
}
});

let monthlyChart = new Chart(
document.getElementById("monthlyChart"),
{
type:"line",
data:{
labels:["Jan","Feb","Mar","Apr","May","Jun"],
datasets:[{
data:[],
borderColor:"#38bdf8",
backgroundColor:"rgba(56,189,248,0.2)",
fill:true,
tension:0.4
}]
}
});

/* FETCH DATA FROM BACKEND */

fetch("{{ url_for('admin.analytics_data') }}")

.then(res => res.json())

.then(data => {

document.getElementById("totalReports").innerText = data.total_reports;
document.getElementById("pendingReports").innerText = data.pending;
document.getElementById("progressReports").innerText = data.progress;
document.getElementById("resolvedReports").innerText = data.resolved;

/* CATEGORY CHART */

categoryChart.data.labels = Object.keys(data.categories);
categoryChart.data.datasets[0].data = Object.values(data.categories);
categoryChart.update();

/* STATUS CHART */

statusChart.data.datasets[0].data = [
data.pending,
data.progress,
data.resolved
];
statusChart.update();

/* MONTHLY CHART */

monthlyChart.data.datasets[0].data = data.monthly;
monthlyChart.update();

})

.catch(err=>{
console.log("Analytics backend not connected yet");
});

</script>

</body>
</html>
